<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rail Fence Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow-sm border-info">
            <div class="card-header bg-info text-white text-center"><h3>RAIL FENCE CIPHER</h3></div>
            <div class="card-body">
                <form method="POST" action="/railfence">
                    <div class="form-group">
                        <label class="font-weight-bold">Input Text:</label>
                        <textarea class="form-control" name="text" rows="3" required>{{ old_text }}</textarea>
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold">Key (Number of Rails):</label>
                        <input type="number" class="form-control" name="key" value="{{ old_key }}" min="2" required>
                    </div>
                    <div class="text-center">
                        <button type="submit" name="encrypt" class="btn btn-info px-4 mr-2">Encrypt</button>
                        <button type="submit" name="decrypt" class="btn btn-secondary px-4">Decrypt</button>
                    </div>
                </form>

                {% if result %}
                <div class="alert alert-warning mt-4 text-dark">
                    <strong>Kết quả:</strong> <span class="text-break">{{ result }}</span>
                </div>
                {% endif %}
            </div>
            <div class="card-footer text-center"><a href="/" class="btn btn-link">Quay lại Menu</a></div>
        </div>
    </div>
</body>
</html>
