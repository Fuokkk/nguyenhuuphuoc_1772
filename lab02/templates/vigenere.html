<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vigenère Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container mt-4">
        <table class="table border">
            <thead>
                <tr>
                    <th class="text-center" style="font-size: 25px; background-color: #f8f9fa;">VIGENÈRE CIPHER</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <h5 class="font-weight-bold" style="color: blue;">ENCRYPTION (Mã hóa)</h5>
                        <form method="POST" action="/vigenere_encrypt">
                            <div class="form-group">
                                <label>Plain text (Văn bản gốc):</label>
                                <input type="text" class="form-control" name="inputPlainText" value="{{old_txt_en}}" placeholder="Nhập văn bản cần mã hóa..." required>
                            </div>
                            <div class="form-group">
                                <label>Key (Từ khóa - Dạng chữ):</label>
                                <input type="text" class="form-control" name="inputKeyPlain" value="{{old_key_en}}" placeholder="Ví dụ: SECRET" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Encrypt</button>
                        </form>
                        
                        {% if res_en %}
                        <div class="alert alert-info mt-3">
                            <strong>Kết quả mã hóa:</strong> <code style="font-size: 1.2rem;">{{ res_en }}</code>
                        </div>
                        {% endif %}
                    </td>
                </tr>

                <tr>
                    <td>
                        <h5 class="font-weight-bold" style="color: green;">DECRYPTION (Giải mã)</h5>
                        <form method="POST" action="/vigenere_decrypt">
                            <div class="form-group">
                                <label>Cipher text (Văn bản đã mã hóa):</label>
                                <input type="text" class="form-control" name="inputCipherText" value="{{old_txt_de}}" placeholder="Nhập bản mã..." required>
                            </div>
                            <div class="form-group">
                                <label>Key (Từ khóa - Phải khớp với lúc mã hóa):</label>
                                <input type="text" class="form-control" name="inputKeyCipher" value="{{old_key_de}}" placeholder="Ví dụ: SECRET" required>
                            </div>
                            <button type="submit" class="btn btn-success">Decrypt</button>
                        </form>

                        {% if res_de %}
                        <div class="alert alert-success mt-3">
                            <strong>Kết quả giải mã:</strong> <code style="font-size: 1.2rem;">{{ res_de }}</code>
                        </div>
                        {% endif %}
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div class="text-center mt-3 mb-5">
            <a href="/" class="btn btn-secondary btn-sm">Quay lại trang chủ</a>
        </div>
    </div>
</body>
</html>
