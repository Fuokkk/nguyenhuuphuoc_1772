<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container mt-4">
        <table class="table border">
            <thead>
                <tr><th class="text-center" style="font-size: 25px;">CAESAR CIPHER</th></tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <h5 class="font-weight-bold text-blue" style="color: blue;">ENCRYPTION</h5>
                        <form method="POST" action="/encrypt">
                            <div class="form-group">
                                <label>Plain text:</label>
                                <input type="text" class="form-control" name="inputPlainText" value="{{old_txt_en}}" required>
                            </div>
                            <div class="form-group">
                                <label>Key:</label>
                                <input type="number" class="form-control" name="inputKeyPlain" value="{{old_key_en}}" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Encrypt</button>
                        </form>
                        
                        {% if res_en %}
                        <div class="alert alert-info mt-3">
                            <strong>Kết quả mã hóa:</strong> {{ res_en }}
                        </div>
                        {% endif %}
                    </td>
                </tr>

                <tr>
                    <td>
                        <h5 class="font-weight-bold" style="color: blue;">DECRYPTION</h5>
                        <form method="POST" action="/decrypt">
                            <div class="form-group">
                                <label>Cipher text:</label>
                                <input type="text" class="form-control" name="inputCipherText" value="{{old_txt_de}}" required>
                            </div>
                            <div class="form-group">
                                <label>Key:</label>
                                <input type="number" class="form-control" name="inputKeyCipher" value="{{old_key_de}}" required>
                            </div>
                            <button type="submit" class="btn btn-success">Decrypt</button>
                        </form>

                        {% if res_de %}
                        <div class="alert alert-success mt-3">
                            <strong>Kết quả giải mã:</strong> {{ res_de }}
                        </div>
                        {% endif %}
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="text-center mt-3">
            <a href="/" class="btn btn-secondary btn-sm">Quay lại trang chủ</a>
        </div>
    </div>
</body>
</html>
