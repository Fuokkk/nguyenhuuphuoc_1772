<!DOCTYPE html>
<html lang="en">
<head>
    <title>Playfair Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow-sm border-dark">
            <div class="card-header bg-dark text-white text-center"><h3>PLAYFAIR CIPHER</h3></div>
            <div class="card-body">
                <form method="POST" action="/playfair">
                    <div class="form-group">
                        <label class="font-weight-bold">Input Text:</label>
                        <textarea class="form-control" name="text" rows="3" required>{{ old_text }}</textarea>
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold">Key (Keyword):</label>
                        <input type="text" class="form-control" name="key" value="{{ old_key }}" required>
                    </div>
                    <div class="text-center">
                        <button type="submit" name="encrypt" class="btn btn-dark px-4 mr-2">Encrypt</button>
                        <button type="submit" name="decrypt" class="btn btn-outline-dark px-4">Decrypt</button>
                    </div>
                </form>

                {% if result %}
                <div class="alert alert-secondary mt-4">
                    <strong>Kết quả:</strong> <span class="text-break">{{ result }}</span>
                </div>
                {% endif %}
            </div>
            <div class="card-footer text-center"><a href="/" class="btn btn-link">Quay lại Menu</a></div>
        </div>
    </div>
</body>
</html>
